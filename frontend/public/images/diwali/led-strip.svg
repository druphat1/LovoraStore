<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Multicolour LED strip light reel with remote">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#2d2150"/><stop offset="1" stop-color="#15121f"/></radialGradient>
    <linearGradient id="rgb" x1="0" x2="1"><stop offset="0" stop-color="#ec4899"/><stop offset=".25" stop-color="#a855f7"/><stop offset=".5" stop-color="#38bdf8"/><stop offset=".75" stop-color="#22c55e"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <!-- glowing strip -->
  <path d="M40 300 C 90 180, 170 360, 230 230 S 340 120, 370 170" fill="none" stroke="url(#rgb)" stroke-width="26" stroke-linecap="round" filter="url(#blur)" opacity=".9"/>
  <path d="M40 300 C 90 180, 170 360, 230 230 S 340 120, 370 170" fill="none" stroke="url(#rgb)" stroke-width="10" stroke-linecap="round"/>
  <path d="M40 300 C 90 180, 170 360, 230 230 S 340 120, 370 170" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity=".9"/>
  <!-- reel -->
  <circle cx="110" cy="110" r="62" fill="#f1ebff"/>
  <circle cx="110" cy="110" r="46" fill="none" stroke="url(#rgb)" stroke-width="14"/>
  <circle cx="110" cy="110" r="22" fill="#ddd6f1"/>
  <!-- remote -->
  <g transform="translate(278 236) rotate(12)">
    <rect width="70" height="128" rx="16" fill="#ffffff"/>
    <circle cx="35" cy="24" r="9" fill="#ef4444"/>
    <g>
      <circle cx="18" cy="56" r="7" fill="#ec4899"/><circle cx="35" cy="56" r="7" fill="#22c55e"/><circle cx="52" cy="56" r="7" fill="#38bdf8"/>
      <circle cx="18" cy="78" r="7" fill="#a855f7"/><circle cx="35" cy="78" r="7" fill="#f59e0b"/><circle cx="52" cy="78" r="7" fill="#f472b6"/>
      <rect x="14" y="96" width="42" height="14" rx="7" fill="#e6dffa"/>
    </g>
  </g>
  <text x="40" y="372" font-family="Quicksand, sans-serif" font-size="15" font-weight="700" fill="#e9d5ff">5 m · 16 colours · remote</text>
</svg>
