<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Rangoli colour powders with stencil and finished floral rangoli">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f1ff"/><stop offset="1" stop-color="#ffd9e4"/></linearGradient>
    <g id="petal"><path d="M0 0 Q-20 -40 0 -80 Q20 -40 0 0Z"/></g>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <!-- finished rangoli -->
  <g transform="translate(200 170)">
    <circle r="118" fill="#fff" opacity=".7"/>
    <g fill="#ec4899"><use href="#petal" transform="rotate(0)"/><use href="#petal" transform="rotate(45)"/><use href="#petal" transform="rotate(90)"/><use href="#petal" transform="rotate(135)"/><use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(225)"/><use href="#petal" transform="rotate(270)"/><use href="#petal" transform="rotate(315)"/></g>
    <g fill="#f59e0b" transform="scale(.7) rotate(22.5)"><use href="#petal" transform="rotate(0)"/><use href="#petal" transform="rotate(45)"/><use href="#petal" transform="rotate(90)"/><use href="#petal" transform="rotate(135)"/><use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(225)"/><use href="#petal" transform="rotate(270)"/><use href="#petal" transform="rotate(315)"/></g>
    <g fill="#712ae2" transform="scale(.4)"><use href="#petal" transform="rotate(0)"/><use href="#petal" transform="rotate(60)"/><use href="#petal" transform="rotate(120)"/><use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(240)"/><use href="#petal" transform="rotate(300)"/></g>
    <circle r="14" fill="#22c55e"/><circle r="6" fill="#fde047"/>
    <g fill="#38bdf8"><circle cx="0" cy="-100" r="6"/><circle cx="100" cy="0" r="6"/><circle cx="0" cy="100" r="6"/><circle cx="-100" cy="0" r="6"/><circle cx="71" cy="-71" r="5"/><circle cx="71" cy="71" r="5"/><circle cx="-71" cy="71" r="5"/><circle cx="-71" cy="-71" r="5"/></g>
  </g>
  <!-- colour pots -->
  <g transform="translate(0 320)">
    <g><ellipse cx="70" cy="18" rx="34" ry="12" fill="#ec4899"/><path d="M36 18 L44 52 L96 52 L104 18" fill="#fff"/></g>
    <g><ellipse cx="155" cy="18" rx="34" ry="12" fill="#f59e0b"/><path d="M121 18 L129 52 L181 52 L189 18" fill="#fff"/></g>
    <g><ellipse cx="240" cy="18" rx="34" ry="12" fill="#712ae2"/><path d="M206 18 L214 52 L266 52 L274 18" fill="#fff"/></g>
    <g><ellipse cx="325" cy="18" rx="34" ry="12" fill="#22c55e"/><path d="M291 18 L299 52 L351 52 L359 18" fill="#fff"/></g>
  </g>
